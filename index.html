<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>GitHub Portfolio Showcase</title>
      <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
      <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
      <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

            :root {
                  --glass-bg: rgba(255, 255, 255, 0.1);
                  --glass-border: rgba(255, 255, 255, 0.2);
            }

            body {
                  font-family: 'Space Grotesk', sans-serif;
                  margin: 0;
                  overflow-x: hidden;
                  background: #0a192f;
            }

            #canvas-container {
                  position: fixed;
                  top: 0;
                  left: 0;
                  width: 100%;
                  height: 100%;
                  z-index: -1;
            }

            .glass {
                  background: var(--glass-bg);
                  backdrop-filter: blur(10px);
                  border: 1px solid var(--glass-border);
                  border-radius: 16px;
            }

            .repo-card {
                  transition: all 0.3s ease;
            }

            .repo-card:hover {
                  transform: translateY(-5px);
                  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            }

            .language-dot {
                  width: 12px;
                  height: 12px;
                  border-radius: 50%;
                  display: inline-block;
                  margin-right: 6px;
            }

            .skeleton {
                  animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }

            @keyframes pulse {

                  0%,
                  100% {
                        opacity: 1;
                  }

                  50% {
                        opacity: .5;
                  }
            }
      </style>
</head>

<body class="text-white">
      <div id="canvas-container"></div>

      <main class="container mx-auto px-4 py-12 relative z-10">
            <header class="glass p-8 mb-12 text-center">
                  <h1
                        class="text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                        My Repositories
                  </h1>
                  <p class="text-xl text-gray-300">Showcasing my featured projects</p>
            </header>

            <div id="repos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  <!-- Skeleton loading cards will be inserted here -->
            </div>
      </main>

      <script>
            // Three.js Animation Setup
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            const container = document.getElementById('canvas-container');
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Create particles
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 2000;
            const posArray = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount * 3; i++) {
                  posArray[i] = (Math.random() - 0.5) * 10;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                  size: 0.005,
                  color: '#ffffff',
                  transparent: true,
                  opacity: 0.8
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            camera.position.z = 3;

            // Animation
            function animate() {
                  requestAnimationFrame(animate);
                  particlesMesh.rotation.y += 0.001;
                  particlesMesh.rotation.x += 0.0005;
                  renderer.render(scene, camera);
            }
            animate();

            // Resize handler
            window.addEventListener('resize', () => {
                  camera.aspect = window.innerWidth / window.innerHeight;
                  camera.updateProjectionMatrix();
                  renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // GitHub API Integration
            const GITHUB_USERNAME = 'SIDDHU123M'; // Replace with your GitHub username
            const reposContainer = document.getElementById('repos-container');

            // Create skeleton loading cards
            function createSkeletons() {
                  const skeletonHTML = Array(6).fill().map(() => `
                <div class="glass p-6 skeleton">
                    <div class="h-6 w-3/4 bg-gray-700 rounded mb-4"></div>
                    <div class="h-4 w-full bg-gray-700 rounded mb-2"></div>
                    <div class="h-4 w-5/6 bg-gray-700 rounded mb-4"></div>
                    <div class="flex justify-between">
                        <div class="h-4 w-1/4 bg-gray-700 rounded"></div>
                        <div class="h-4 w-1/4 bg-gray-700 rounded"></div>
                    </div>
                </div>
            `).join('');
                  reposContainer.innerHTML = skeletonHTML;
            }

            createSkeletons();

            const languageColors = {
                  JavaScript: '#f1e05a',
                  Python: '#3572A5',
                  HTML: '#e34c26',
                  CSS: '#563d7c',
                  TypeScript: '#2b7489',
                  Java: '#b07219'
            };

            async function fetchPinnedRepos() {
                  try {
                        const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos`);
                        const repos = await response.json();

                        // Filter repos with 'pin' topic
                        const pinnedRepos = repos.filter(repo =>
                              repo.topics && repo.topics.includes('pin')
                        );

                        reposContainer.innerHTML = '';

                        for (const repo of pinnedRepos) {
                              const languagesResponse = await fetch(repo.languages_url);
                              const languages = await languagesResponse.json();
                              const primaryLanguage = Object.keys(languages)[0] || 'None';

                              const card = document.createElement('div');
                              card.className = 'glass p-6 repo-card';

                              card.innerHTML = `
                        <h3 class="text-xl font-bold mb-2 flex items-center">
                            <i class="bi bi-bookmark-star-fill text-yellow-400 mr-2"></i>
                            <a href="${repo.html_url}" class="hover:text-blue-400 transition-colors" target="_blank">
                                ${repo.name}
                            </a>
                        </h3>
                        <p class="text-gray-300 mb-4 h-20 overflow-hidden">${repo.description || 'No description available'}</p>
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center">
                                <span class="language-dot" style="background-color: ${languageColors[primaryLanguage] || '#888'}"></span>
                                <span class="text-sm text-gray-400">${primaryLanguage}</span>
                            </div>
                            <div class="flex items-center space-x-4">
                                <span class="flex items-center text-sm">
                                    <i class="bi bi-star-fill text-yellow-400 mr-1"></i>
                                    ${repo.stargazers_count}
                                </span>
                                <span class="flex items-center text-sm">
                                    <i class="bi bi-git-branch text-gray-400 mr-1"></i>
                                    ${repo.forks_count}
                                </span>
                            </div>
                        </div>
                        ${repo.homepage ? `
                            <a href="${repo.homepage}" class="inline-flex items-center text-blue-400 hover:text-blue-300 transition-colors" target="_blank">
                                <i class="bi bi-box-arrow-up-right mr-1"></i>
                                Live Demo
                            </a>
                        ` : ''}
                    `;

                              reposContainer.appendChild(card);
                        }
                  } catch (error) {
                        console.error('Error fetching repositories:', error);
                        reposContainer.innerHTML = `
                    <div class="col-span-full text-center text-red-400 glass p-6">
                        <i class="bi bi-exclamation-triangle text-2xl mb-2"></i>
                        <p>Failed to load repositories. Please try again later.</p>
                    </div>
                `;
                  }
            }

            fetchPinnedRepos();
      </script>
</body>

</html>
